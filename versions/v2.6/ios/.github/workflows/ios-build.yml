name: Build iOS V2.6
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Test native iOS implementation
        shell: bash
        run: python3 build_ios.py --test 2>&1 | tee ios-test.log
      - name: Archive unsigned IPA
        shell: bash
        run: python3 build_ios.py --unsigned 2>&1 | tee ios-archive.log
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: binary_image_passcode_v2.6_ios_unsigned
          path: |
            dist/*unsigned.ipa
          if-no-files-found: error
      - name: Upload test results and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary_image_passcode_v2.6_ios_diagnostics
          path: |
            dist/*.xcresult
            ios-test.log
            ios-archive.log
          if-no-files-found: warn
